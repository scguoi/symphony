services:
  symphony:
    build:
      context: .
      dockerfile: Dockerfile
    image: forgeflow-symphony:orchestrator
    environment:
      PLANE_API_BASE_URL: ${PLANE_API_BASE_URL:-http://plane-web:3000}
      PLANE_API_KEY: ${PLANE_API_KEY:?set PLANE_API_KEY}
      PLANE_WORKSPACE_SLUG: ${PLANE_WORKSPACE_SLUG:?set PLANE_WORKSPACE_SLUG}
      PLANE_PROJECT_ID: ${PLANE_PROJECT_ID:?set PLANE_PROJECT_ID}
      PLANE_PROJECT_IDENTIFIER: ${PLANE_PROJECT_IDENTIFIER:-}
      PLANE_ASSIGNEE: ${PLANE_ASSIGNEE:-}
      GITEA_REPOSITORY_URL: ${GITEA_REPOSITORY_URL:?set GITEA_REPOSITORY_URL}
      GITEA_UPSTREAM_URL: ${GITEA_UPSTREAM_URL:-}
      SYMPHONY_WORKSPACE_ROOT: /workspaces
    ports:
      - "4000:4000"
    volumes:
      - symphony-workspaces:/workspaces
      - ${HOME}/.ssh:/root/.ssh:ro

volumes:
  symphony-workspaces:
